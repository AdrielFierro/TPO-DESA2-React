# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - comedorfe

on:
  push:
    branches:
      - levantarWebApp
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies and build
        run: |
          # use a reproducible install in CI
          npm ci
          # fail the job if build script is missing or fails
          npm run build
      - name: Verify build output
        run: |
          echo "=== Listing dist ==="
          ls -la ./dist || (echo "dist not found — build failed or output path is different" && exit 1)
          du -sh ./dist || true
      - name: Run tests (if present)
        run: |
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          # upload only the build output (static files) instead of the entire repo
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_785ADBBDF20D46CCA0E981F34943203E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2D4AB2ABF4F74F84BD4C0FD424FD1D1C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_233AC4E72E664101B2477B3443A65953 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'comedorfe'
          slot-name: 'Production'
          # deploy the built static site (dist folder)
          package: ./dist
          